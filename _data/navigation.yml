# Navigation Configuration for Jekyll Site
# Updated to include nested dropdown functionality

main:
  - title: "Home"
    url: /

  - title: "Team"
    url: /team/  
  
  - title: "Teaching"
    url: /teaching/courses/
    dropdown: true
    dropdown_items:
    - title: "Courses"
      url: /teaching/courses/
      filter: "all"
    - title: "Theses"
      url: /teaching/theses/

  - title: "Projects"
    url: /projects/
    
  - title: "Publications"
    url: /publications/
  
  - title: "Vacancies"
    url: /vacancies/
  
  - title: "News"
    url: /news/

