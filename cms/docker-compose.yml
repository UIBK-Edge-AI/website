services:
  database:
    image: postgres:16-alpine
    container_name: directus_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-directus}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-directus_secure_password_123}
      POSTGRES_DB: ${DB_DATABASE:-directus}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-directus} -d ${DB_DATABASE:-directus}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - directus_network

  cache:
    image: redis:7-alpine
    container_name: directus_redis
    restart: unless-stopped
    volumes:
      - ./data/redis:/data
    networks:
      - directus_network

  directus:
    image: directus/directus:11.3.5
    container_name: directus_cms
    restart: unless-stopped
    ports:
      - "127.0.0.1:8055:8055"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_started
    environment:
      KEY: ${SECRET_KEY:-22906b3a-fca3-4d4f-9e77-9dfc299c8fba}
      SECRET: ${SECRET_TOKEN:-0588602b-a48f-4b07-bb25-ca641b4e287a}

      # Admin credentials
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@uibk-edgeai.ac.at}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminEdgeAI2026!}

      # Database Configuration
      DB_CLIENT: postgres
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: ${DB_DATABASE:-directus}
      DB_USER: ${DB_USER:-directus}
      DB_PASSWORD: ${DB_PASSWORD:-directus_secure_password_123}

      # Redis Cache
      CACHE_ENABLED: "true"
      CACHE_STORE: "redis"
      REDIS: "redis://cache:6379"

      # Public URL (Change to your production CMS domain)
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8055}

      # Storage (Local file uploads)
      STORAGE_LOCATIONS: "local"
      STORAGE_LOCAL_ROOT: "/directus/uploads"

      # Security & CORS
      CORS_ENABLED: "true"
      CORS_ORIGIN: "true"
      CORS_METHODS: "GET,POST,PATCH,DELETE,OPTIONS"
      CORS_ALLOWED_HEADERS: "Content-Type,Authorization"
      CORS_EXPOSED_HEADERS: "Content-Range"

      # Telemetry
      TELEMETRY: "false"

      # Rate limiting & Webhooks
      RATE_LIMITER_ENABLED: "false"
      WEBHOOKS_ENABLED: "true"

    volumes:
      - ./uploads:/directus/uploads
      - ./extensions:/directus/extensions
    networks:
      - directus_network

networks:
  directus_network:
    driver: bridge
