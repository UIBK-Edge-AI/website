# /etc/nginx/sites-available/edgeai-webhook.conf
# Nginx Reverse Proxy for Webhook Build Receiver

server {
    listen 443 ssl http2;
    server_name webhook.edgeai.uibk.ac.at;

    ssl_certificate /etc/letsencrypt/live/webhook.edgeai.uibk.ac.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/webhook.edgeai.uibk.ac.at/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:9000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
