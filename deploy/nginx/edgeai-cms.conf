# /etc/nginx/sites-available/edgeai-cms.conf
# Nginx Reverse Proxy for Directus Headless CMS

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name cms.edgeai.uibk.ac.at;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Directus Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cms.edgeai.uibk.ac.at;

    # SSL Certificates
    ssl_certificate /etc/letsencrypt/live/cms.edgeai.uibk.ac.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cms.edgeai.uibk.ac.at/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/cms.edgeai.uibk.ac.at/chain.pem;

    # SSL Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # File Upload Limits (Support large PDF papers & high-res research photos)
    client_max_body_size 50M;

    location / {
        proxy_pass http://127.0.0.1:8055;
        proxy_http_version 1.1;

        # WebSocket Upgrade Support (for Directus real-time collaborative edits)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Standard Proxy Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # Timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Buffering
        proxy_buffering on;
        proxy_buffers 8 16k;
        proxy_buffer_size 16k;
    }
}
