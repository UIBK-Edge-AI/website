# /etc/nginx/sites-available/edgeai-frontend.conf
# Nginx Virtual Host for Edge AI Astro Static Website

# HTTP Redirect to HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name edgeai.uibk.ac.at www.edgeai.uibk.ac.at;

    # Let's Encrypt ACME Challenge
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name edgeai.uibk.ac.at www.edgeai.uibk.ac.at;

    # Document Root (Deployed Astro build)
    root /var/www/edgeai/dist;
    index index.html;

    # SSL Certificates (Let's Encrypt / Certbot)
    ssl_certificate /etc/letsencrypt/live/edgeai.uibk.ac.at/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/edgeai.uibk.ac.at/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/edgeai.uibk.ac.at/chain.pem;

    # Modern SSL Security Protocols & Ciphers
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Clean URL routing for Astro directory format
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    # Static Assets Caching (Images, Fonts, JS/CSS bundles)
    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?|ttf|eot|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Custom 404 Error Page
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
